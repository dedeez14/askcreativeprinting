server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Long cache for built assets (Vite uses content-hashed filenames in /assets/)
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The 3D garment meshes and their fabric maps. Content is fixed per deploy and each file
    # is a few hundred kB, so it is worth caching hard.
    location ~ ^/(models|fabric)/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # The customer's uploaded artwork, passed through this origin.
    #
    # The design studio paints that file onto the 3D product, and WebGL will only accept an
    # image the page is allowed to READ. The ERP serves uploads from another origin and sends
    # no CORS header for /storage, so the browser refused them: the upload showed as a
    # thumbnail and then never appeared on the model. Serving the same bytes from here removes
    # the cross-origin question instead of widening the ERP's CORS policy. The signed query
    # string is passed straight through — the ERP still checks it.
    location ~ ^/erp-media/(.*)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $erp_host erp.askcreativeprinting.com;
        proxy_pass https://$erp_host/storage/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $erp_host;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_method GET;
        add_header Cache-Control "private, max-age=300";
    }

    # "^~" so these prefixes win over the file-extension regex below.
    # Photos and the self-hosted web fonts. Not content-hashed, so a month for photos (a replaced
    # photo shows within that time), a year for fonts (their files never change).
    location ^~ /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # The two HTML shells (also reached through the fallbacks below): always revalidated.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # A path with a file extension is a file, never a page: missing → a real 404, not the SPA.
    # Before this, /llms.txt and /.well-known/*.json answered 200 with the home page HTML, which
    # Lighthouse's Agentic Browsing audits then read as a broken llms.txt / agent catalog.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # "/" is the prerendered home page (scripts/prerender.mjs). HTML is revalidated on every visit
    # so a deploy is picked up at once; the hashed /assets/ files it points to stay cached.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # SPA fallback — every other route gets the empty shell (app.html) and React Router renders it.
    # Requires a build that has app.html (build of 15-Nov-2026 or later).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /app.html;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
